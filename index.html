<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日热搜</title>
  <style>
    /* ========== 极简主题：砍掉一切不影响「看榜」的装饰 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
      line-height: 1.5;
    }

    /* 页面主体：限宽居中，手机上自动留边，永不横向滚动 */
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .page-header { margin-bottom: 16px; }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .page-date {
      margin-top: 4px;
      font-size: 14px;
      color: #888;
    }

    /* 筛选条（Day 12）：按名次段筛选，点中项高亮 = 「生效了」的即时反馈 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filter-btn {
      padding: 5px 14px;
      font-size: 13px;
      color: #555;
      background: #fff;
      border: 1px solid #e0e0e3;
      border-radius: 14px;
      cursor: pointer;
    }
    .filter-btn:active { background: #f0f0f2; }
    /* 选中态：黑底白字，对比度极高，一眼看出当前条件 */
    .filter-btn.active {
      color: #fff;
      background: #1a1a1a;
      border-color: #1a1a1a;
    }

    /* 榜单：白卡片，每条一行，靠序号+热度做视觉层次 */
    .hot-list {
      list-style: none;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .hot-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;   /* 15px：给每行呼吸感，手机上不易误触 */
      border-bottom: 1px solid #f0f0f0;
      position: relative;   /* 作为整行可点击的定位基准 */
    }
    .hot-item:last-child { border-bottom: none; }

    /* 整行可点：链接的透明覆盖层铺满整行（触控目标规则） */
    .hot-item .hot-title a::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    /* 排名：前三名金银铜（金 > 银 > 铜），其余灰色 */
    .hot-rank {
      flex: none;
      width: 26px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: #999;
      font-style: italic;
    }
    .hot-rank.top1 { color: #d4a017; }
    .hot-rank.top2 { color: #8e959e; }
    .hot-rank.top3 { color: #b87333; }

    /* 标题：占满剩余宽度，过长省略号，点击区域整行 */
    .hot-title {
      flex: 1;
      min-width: 0;               /* 配合省略号，防止撑破容器 */
      font-size: 15px;
    }
    .hot-title a {
      color: inherit;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-item:active { background: #fafafa; }

    /* 热度值：右侧弱化展示（#888：弱化但不隐形） */
    .hot-heat {
      flex: none;
      font-size: 12px;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    /* 复制按钮：弱化存在感，悬停才显眼（Day 11） */
    .copy-btn {
      flex: none;
      position: relative;   /* 高于整行点击覆盖层，保证按钮自己先接到点击 */
      z-index: 1;
      padding: 3px 10px;
      font-size: 12px;
      color: #888;
      background: #f5f5f6;
      border: 1px solid #e5e5e7;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .copy-btn:hover { background: #ececee; color: #555; }
    .copy-btn:active { background: #e0e0e3; }
    /* 反馈态：复制成功后短暂变绿（就地 + 说明结果） */
    .copy-btn.copied {
      color: #1d9e75;
      background: #e1f5ee;
      border-color: #9fe1cb;
    }

    .page-footer {
      margin-top: 16px;
      text-align: left;   /* 与标题、榜单共享同一条左边线（对齐规则） */
      font-size: 12px;
      color: #999;
    }

    /* ========== 页面状态（Day 8）：加载 / 空 / 错误 ========== */
    /* 加载态：灰色占位条 */
    .bar-row { padding: 13px 16px 0; }
    .bar-row:last-of-type { padding-bottom: 0; }
    .bar {
      display: block;
      height: 14px;
      border-radius: 4px;
      background: #f0f0f0;
    }

    /* 空态 / 错误态：居中提示 */
    .state-note {
      padding: 32px 16px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }
    .state-error { color: #c62828; }

    .retry-btn {
      margin-top: 12px;
      padding: 6px 20px;
      font-size: 13px;
      color: #c62828;
      background: #fff;
      border: 1px solid #c62828;
      border-radius: 6px;
      cursor: pointer;
    }
    .retry-btn:active { background: #fdf3f3; }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="page-title">今日热搜</h1>
      <p class="page-date" id="board-date">加载中…</p>
    </header>

    <!-- 筛选条（Day 12）：名次段筛选；「有结果 / 无结果 / 清空恢复」三种情况都从这里走 -->
    <div class="filter-bar" id="filter-bar" role="group" aria-label="榜单筛选">
      <button class="filter-btn active" type="button" data-limit="0">全部</button>
      <button class="filter-btn" type="button" data-limit="3">Top3</button>
      <button class="filter-btn" type="button" data-limit="5">Top5</button>
    </div>

    <!-- 榜单容器：2.4 的渲染逻辑会把 10 条热搜填进这里 -->
    <ol class="hot-list" id="hot-list"></ol>

    <footer class="page-footer">
      <p>数据由站长每日手动整理 ｜ <span class="footer-source" id="board-source"></span></p>
    </footer>
  </main>

  <!-- 唯一数据源头（PRD F3）：必须先于下面的逻辑加载 -->
  <script src="data.js"></script>
  <script>
    // ============================================
    // 渲染逻辑（Day 8 升级）：四种状态全覆盖
    // 正常：读 data.js → 渲染 → 写本地缓存
    // 加载：页面打开瞬间先摆灰色占位条
    // 空态：数据合法但 0 条 → 「今日暂无热搜」
    // 错误：数据损坏/加载失败 → 提示 + 重试按钮
    // 演示开关：地址后加 ?state=loading / empty / error 可强制进入对应状态
    // ============================================
    (function () {
      var listEl = document.getElementById("hot-list");
      var dateEl = document.getElementById("board-date");
      var sourceEl = document.getElementById("board-source");
      var CACHE_KEY = "hot-board-cache"; // 浏览器缓存钥匙（断网兜底用）
      var itemsRef = [];        // 当前可筛选的数据（正常态=全部条目，空态=空数组）
      var currentLimit = 0;     // 当前筛选的名次上限，0=全部（Day 12）
      var filterBar = document.getElementById("filter-bar"); // 筛选条容器

      // ---- 三种非常态的画法 ----
      function showLoading() {
        var bars = "";
        for (var i = 0; i < 5; i++) {
          bars += '<li class="bar-row"><span class="bar"></span></li>';
        }
        listEl.innerHTML = bars + '<li class="state-note">⏳ 加载中…</li>';
      }
      function showEmpty() {
        dateEl.textContent = "—"; // 没有数据就没有可信日期
        listEl.innerHTML = '<li class="state-note">📭 今日暂无热搜，站长还没更新</li>';
      }
      function showError() {
        listEl.innerHTML =
          '<li class="state-note state-error">⚠️ 榜单加载失败' +
          '<br><button class="retry-btn" onclick="location.reload()">点击重试</button></li>';
      }

      // ---- 正常态 ----
      function formatDate(iso) {
        var parts = iso.split("-");
        return parts[1] + "月" + parts[2] + "日热搜";
      }
      function renderItem(item) {
        var rankClass = item.rank === 1 ? " top1" : item.rank === 2 ? " top2" : item.rank === 3 ? " top3" : "";
        return (
          '<li class="hot-item">' +
          '<span class="hot-rank' + rankClass + '">' + item.rank + "</span>" +
          '<span class="hot-title"><a href="' + item.url + '" target="_blank" rel="noopener">' + item.title + "</a></span>" +
          '<span class="hot-heat">' + item.source + " · " + item.heat.toLocaleString() + " 热度</span>" +
          '<button class="copy-btn" type="button" data-title="' + item.title.replace(/"/g, "&quot;") + '">复制</button>' +
          "</li>"
        );
      }
      function render(data) {
        dateEl.textContent = formatDate(data.date);
        var html = "";
        for (var i = 0; i < data.items.length; i++) {
          html += renderItem(data.items[i]);
        }
        listEl.innerHTML = html;
      }

      // ---- Day 12：名次段筛选 ----
      function applyFilter() {
        var filtered = [];
        for (var i = 0; i < itemsRef.length; i++) {
          if (currentLimit === 0 || itemsRef[i].rank <= currentLimit) filtered.push(itemsRef[i]);
        }
        if (filtered.length === 0) {
          // 无结果：复用空态样式，并给出回到「全部」的出口（反馈要给出口，不留死胡同）
          listEl.innerHTML = '<li class="state-note">📭 该筛选条件下暂无热搜，试试「全部」</li>';
          return;
        }
        var html = "";
        for (var j = 0; j < filtered.length; j++) html += renderItem(filtered[j]);
        listEl.innerHTML = html;
      }

      // 事件委托：筛选按钮点击 → 选中项高亮 + 榜单重渲染
      // 反馈三要素：即时（点击瞬间高亮）、就地（就是被点的那个按钮）、说明结果（榜单立刻变）
      filterBar.addEventListener("click", function (ev) {
        var btn = ev.target.closest ? ev.target.closest(".filter-btn") : null;
        if (!btn) return;
        var all = filterBar.querySelectorAll(".filter-btn");
        for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
        btn.classList.add("active");
        currentLimit = parseInt(btn.getAttribute("data-limit"), 10) || 0;
        applyFilter();
      });

      // ---- Day 11：一键复制标题（带反馈的交互） ----
      // 事件委托：按钮是动态渲染的，监听挂在列表容器上，一次管住所有按钮
      listEl.addEventListener("click", function (ev) {
        var btn = ev.target.closest ? ev.target.closest(".copy-btn") : null;
        if (!btn) return; // 点的不是复制按钮，交给整行跳转逻辑
        copyText(btn.getAttribute("data-title"), btn);
      });

      function copyText(text, btn) {
        // 现代浏览器走 clipboard API（localhost 属于安全环境，可用）
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { flashCopied(btn, true); },
            function () { flashCopied(btn, fallbackCopy(text)); }
          );
        } else {
          // 兜底：file:// 双击打开等场景走老办法
          flashCopied(btn, fallbackCopy(text));
        }
      }

      // 老办法：临时文本框 + execCommand（断网双击打开页面时也能复制）
      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { /* 有的浏览器禁止 */ }
        document.body.removeChild(ta);
        return ok;
      }

      // 反馈三要素：即时（点击即变色）、就地（按钮自己变）、说明结果（✓ 已复制）
      function flashCopied(btn, ok) {
        btn.classList.add("copied");
        btn.textContent = ok ? "✓ 已复制" : "✗ 没复制上";
        clearTimeout(btn._copyTimer); // 连续快点不串台：每次都重新计时
        btn._copyTimer = setTimeout(function () {
          btn.classList.remove("copied");
          btn.textContent = "复制";
        }, 1500);
      }

      // ---- 主流程 ----
      showLoading(); // 第一步永远是加载态（哪怕只有一瞬间）

      // 演示开关：?state=xxx 强制进入指定状态（教学验证用，不影响正常使用）
      var forced = new URLSearchParams(location.search).get("state");
      if (forced === "loading") return;
      if (forced === "empty")  { showEmpty(); return; }
      if (forced === "error")  { showError(); return; }

      if (typeof HOT_DATA !== "undefined" && Array.isArray(HOT_DATA.items) && HOT_DATA.items.length > 0) {
        // 正常路径：有数据
        itemsRef = HOT_DATA.items; // 把数据交给筛选器（Day 12 接线）
        render(HOT_DATA);
        sourceEl.textContent = "来源：" + HOT_DATA.items[0].source;
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(HOT_DATA)); // 写缓存供断网兜底
        } catch (e) { /* 缓存写不进去不影响显示 */ }
      } else if (typeof HOT_DATA !== "undefined" && Array.isArray(HOT_DATA.items) && HOT_DATA.items.length === 0) {
        // 空态：数据合法但 0 条（比如站长还没更新）
        showEmpty();
      } else {
        // 错误路径：数据文件缺失/损坏——先试缓存兜底，兜不住才亮错误态
        try {
          var cached = JSON.parse(localStorage.getItem(CACHE_KEY));
          if (cached && cached.items && cached.items.length > 0) {
            itemsRef = cached.items; // 离线数据同样交给筛选器（Day 12 接线）
            render(cached);
            sourceEl.textContent = "来源：" + cached.items[0].source + "（离线缓存）";
            return;
          }
        } catch (e) { /* 缓存也没有 */ }
        showError();
      }
    })();
  </script>
</body>
</html>
