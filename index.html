<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日热搜</title>
  <style>
    /* ========== 极简主题：砍掉一切不影响「看榜」的装饰 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
      line-height: 1.5;
    }

    /* 页面主体：限宽居中，手机上自动留边，永不横向滚动 */
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .page-header { margin-bottom: 16px; }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .page-date {
      margin-top: 4px;
      font-size: 14px;
      color: #888;
    }

    /* 榜单：白卡片，每条一行，靠序号+热度做视觉层次 */
    .hot-list {
      list-style: none;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .hot-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;   /* 15px：给每行呼吸感，手机上不易误触 */
      border-bottom: 1px solid #f0f0f0;
      position: relative;   /* 作为整行可点击的定位基准 */
    }
    .hot-item:last-child { border-bottom: none; }

    /* 整行可点：链接的透明覆盖层铺满整行（触控目标规则） */
    .hot-item .hot-title a::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    /* 排名：前三名给警示红，其余灰色 */
    .hot-rank {
      flex: none;
      width: 26px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      color: #999;
      font-style: italic;
    }
    .hot-rank.top3 { color: #e53935; }

    /* 标题：占满剩余宽度，过长省略号，点击区域整行 */
    .hot-title {
      flex: 1;
      min-width: 0;               /* 配合省略号，防止撑破容器 */
      font-size: 15px;
    }
    .hot-title a {
      color: inherit;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-item:active { background: #fafafa; }

    /* 热度值：右侧弱化展示（#888：弱化但不隐形） */
    .hot-heat {
      flex: none;
      font-size: 12px;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    .page-footer {
      margin-top: 16px;
      text-align: left;   /* 与标题、榜单共享同一条左边线（对齐规则） */
      font-size: 12px;
      color: #999;
    }

    /* ========== 页面状态（Day 8）：加载 / 空 / 错误 ========== */
    /* 加载态：灰色占位条 */
    .bar-row { padding: 13px 16px 0; }
    .bar-row:last-of-type { padding-bottom: 0; }
    .bar {
      display: block;
      height: 14px;
      border-radius: 4px;
      background: #f0f0f0;
    }

    /* 空态 / 错误态：居中提示 */
    .state-note {
      padding: 32px 16px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }
    .state-error { color: #c62828; }

    .retry-btn {
      margin-top: 12px;
      padding: 6px 20px;
      font-size: 13px;
      color: #c62828;
      background: #fff;
      border: 1px solid #c62828;
      border-radius: 6px;
      cursor: pointer;
    }
    .retry-btn:active { background: #fdf3f3; }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="page-title">今日热搜</h1>
      <p class="page-date" id="board-date">加载中…</p>
    </header>

    <!-- 榜单容器：2.4 的渲染逻辑会把 10 条热搜填进这里 -->
    <ol class="hot-list" id="hot-list"></ol>

    <footer class="page-footer">
      <p>数据由站长每日手动整理 ｜ <span class="footer-source" id="board-source"></span></p>
    </footer>
  </main>

  <!-- 唯一数据源头（PRD F3）：必须先于下面的逻辑加载 -->
  <script src="data.js"></script>
  <script>
    // ============================================
    // 渲染逻辑（Day 8 升级）：四种状态全覆盖
    // 正常：读 data.js → 渲染 → 写本地缓存
    // 加载：页面打开瞬间先摆灰色占位条
    // 空态：数据合法但 0 条 → 「今日暂无热搜」
    // 错误：数据损坏/加载失败 → 提示 + 重试按钮
    // 演示开关：地址后加 ?state=loading / empty / error 可强制进入对应状态
    // ============================================
    (function () {
      var listEl = document.getElementById("hot-list");
      var dateEl = document.getElementById("board-date");
      var sourceEl = document.getElementById("board-source");
      var CACHE_KEY = "hot-board-cache"; // 浏览器缓存钥匙（断网兜底用）

      // ---- 三种非常态的画法 ----
      function showLoading() {
        var bars = "";
        for (var i = 0; i < 5; i++) {
          bars += '<li class="bar-row"><span class="bar"></span></li>';
        }
        listEl.innerHTML = bars + '<li class="state-note">⏳ 加载中…</li>';
      }
      function showEmpty() {
        dateEl.textContent = "—"; // 没有数据就没有可信日期
        listEl.innerHTML = '<li class="state-note">📭 今日暂无热搜，站长还没更新</li>';
      }
      function showError() {
        listEl.innerHTML =
          '<li class="state-note state-error">⚠️ 榜单加载失败' +
          '<br><button class="retry-btn" onclick="location.reload()">点击重试</button></li>';
      }

      // ---- 正常态 ----
      function formatDate(iso) {
        var parts = iso.split("-");
        return parts[1] + "月" + parts[2] + "日热搜";
      }
      function renderItem(item) {
        var top3 = item.rank <= 3 ? " top3" : "";
        return (
          '<li class="hot-item">' +
          '<span class="hot-rank' + top3 + '">' + item.rank + "</span>" +
          '<span class="hot-title"><a href="' + item.url + '" target="_blank" rel="noopener">' + item.title + "</a></span>" +
          '<span class="hot-heat">' + item.source + " · " + item.heat.toLocaleString() + " 热度</span>" +
          "</li>"
        );
      }
      function render(data) {
        dateEl.textContent = formatDate(data.date);
        var html = "";
        for (var i = 0; i < data.items.length; i++) {
          html += renderItem(data.items[i]);
        }
        listEl.innerHTML = html;
      }

      // ---- 主流程 ----
      showLoading(); // 第一步永远是加载态（哪怕只有一瞬间）

      // 演示开关：?state=xxx 强制进入指定状态（教学验证用，不影响正常使用）
      var forced = new URLSearchParams(location.search).get("state");
      if (forced === "loading") return;
      if (forced === "empty")  { showEmpty(); return; }
      if (forced === "error")  { showError(); return; }

      if (typeof HOT_DATA !== "undefined" && Array.isArray(HOT_DATA.items) && HOT_DATA.items.length > 0) {
        // 正常路径：有数据
        render(HOT_DATA);
        sourceEl.textContent = "来源：" + HOT_DATA.items[0].source;
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(HOT_DATA)); // 写缓存供断网兜底
        } catch (e) { /* 缓存写不进去不影响显示 */ }
      } else if (typeof HOT_DATA !== "undefined" && Array.isArray(HOT_DATA.items) && HOT_DATA.items.length === 0) {
        // 空态：数据合法但 0 条（比如站长还没更新）
        showEmpty();
      } else {
        // 错误路径：数据文件缺失/损坏——先试缓存兜底，兜不住才亮错误态
        try {
          var cached = JSON.parse(localStorage.getItem(CACHE_KEY));
          if (cached && cached.items && cached.items.length > 0) {
            render(cached);
            sourceEl.textContent = "来源：" + cached.items[0].source + "（离线缓存）";
            return;
          }
        } catch (e) { /* 缓存也没有 */ }
        showError();
      }
    })();
  </script>
</body>
</html>
